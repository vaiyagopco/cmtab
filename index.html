<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src https://script.google.com https://script.googleusercontent.com; base-uri 'none'; form-action 'none'">
<meta name="theme-color" content="#1b2620">
<meta name="referrer" content="no-referrer">
<title>CMTabSystem</title>
<style>
/* ===== สีหลัก (โทนเขียวมะนาว AIS + ส้ม 3BB) — แก้ที่นี่ที่เดียว ===== */
:root{
  --g:#B2D235;      /* เขียว AIS: พื้นปุ่มหลัก / จุดเน้น */
  --gd:#4d7a05;     /* เขียวเข้ม: ตัวอักษร/ไอคอนบนพื้นขาว */
  --o:#F58220;      /* ส้ม 3BB: ปุ่มสำคัญสุด (เพิ่มข้อมูล) */
  --on-g:#17210d; --on-o:#2a1400;
  --dark:#1b2620;   /* หัวเว็บ */
  --bg:#f2f5ee; --card:#fff; --ink:#18221d; --mut:#5d6b61; --line:#dce4d2; --soft:#eef3e4;
  --err:#b3261e; --r:14px;
}
@media(prefers-color-scheme:dark){:root{
  --gd:#B2D235; --dark:#0c120e; --bg:#0f1511; --card:#18211b; --ink:#e8efe6; --mut:#9aab9e; --line:#2a372d; --soft:#1f2b22; --err:#ff8a80;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font:16px/1.5 system-ui,-apple-system,"Noto Sans Thai","Sarabun",sans-serif;background:var(--bg);color:var(--ink);padding:0 0 env(safe-area-inset-bottom)}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.xl{width:44px;height:44px;stroke-width:1.5}
.hide{display:none!important}

/* ---------- หัวเว็บ ---------- */
#bar{position:fixed;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,transparent,var(--o),transparent) no-repeat;background-size:50% 100%;animation:slide 1s linear infinite;opacity:0;transition:opacity .15s;z-index:50;pointer-events:none}
  const b = $('gps'), old = b.innerHTML; b.disabled = true; b.textContent = 'กำลังจับพิกัด…'; say();
  navigator.geolocation.getCurrentPosition(p => {
    b.disabled = false; b.innerHTML = old;
    $('pin').value = p.coords.latitude.toFixed(6) + ',' + p.coords.longitude.toFixed(6);
    say(p.coords.accuracy > 50 ? 'ความแม่นยำ ±' + Math.round(p.coords.accuracy) + ' ม. ลองจับใหม่กลางแจ้ง' : '');
  }, () => { b.disabled = false; b.innerHTML = old; say('จับพิกัดไม่ได้ ตรวจสอบสิทธิ์ตำแหน่งของเบราว์เซอร์'); },
  {enableHighAccuracy:true, timeout:15000});
};

function upsert(item){
  [rows, allRows, found].forEach((arr, k) => {
    if (!arr) return;
    const i = arr.findIndex(x => x.id === item.id);
    if (i >= 0) arr[i] = item; else if (k < 2) arr.unshift(item);
  });
}

$('save').onclick = () => busy($('save'), 'กำลังบันทึก…', async () => {
  say();
  const rec = {id: $('id').value, sn: keepSn}; F.forEach(k => rec[k] = $(k).value.trim());
  if (!/^(888|880)\d+$/.test(rec.net)) return say('Internet No. ต้องเป็นตัวเลขและขึ้นต้นด้วย 888 หรือ 880');
  const j = await api('save', {rec});
  if (!j.ok) return say(j.error);
  upsert(j.item); formSeq++; view('vList'); draw(); window.scrollTo(0, 0);
});

if (token && me) { goHome(); ping(); } else { view('vLogin'); ping(); }
</script>
</body>
</html>
